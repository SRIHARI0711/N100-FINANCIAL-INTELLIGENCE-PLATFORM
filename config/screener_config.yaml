# Screener Configuration Reference
# Threshold definitions for preset and custom screening

presets:
  quality_compounder:
    name: "Quality Compounder"
    ranking_metric: "composite_score"
    order: "desc"
    rules:
      min_roe: 15.0
      max_de: 1.0
      min_fcf: 0.0
      min_revenue_cagr_5yr: 10.0

  value_pick:
    name: "Value Pick"
    ranking_metric: "fcf_yield"
    order: "desc"
    rules:
      max_pe: 20.0
      max_pb: 3.0
      max_de: 2.0
      min_dividend_yield: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    ranking_metric: "pat_cagr_5yr"
    order: "desc"
    rules:
      min_pat_cagr_5yr: 20.0
      min_revenue_cagr_5yr: 15.0
      max_de: 2.0

  dividend_champion:
    name: "Dividend Champion"
    ranking_metric: "dividend_yield"
    order: "desc"
    rules:
      min_dividend_yield: 2.0
      max_dividend_payout: 80.0
      min_fcf: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    ranking_metric: "roe"
    order: "desc"
    rules:
      max_de: 0.0
      min_roe: 12.0
      min_revenue_crore: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    ranking_metric: "revenue_cagr_3yr"
    order: "desc"
    rules:
      min_revenue_cagr_3yr: 10.0
      min_latest_fcf: 0.0
      deleveraging_only: true

composite_score_weights:
  profitability: 0.35
  cash_quality: 0.30
  growth: 0.20
  leverage: 0.15
